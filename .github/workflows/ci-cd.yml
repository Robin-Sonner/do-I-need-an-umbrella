name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    
    outputs:
      is_release: ${{ steps.check_release.outputs.is_release }}
      git_tag: ${{ steps.check_release.outputs.git_tag }}
      release_notes: ${{ steps.check_release.outputs.release_notes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Check for release
        id: check_release
        shell: pwsh
        run: |
          $isRelease = "${{ startsWith(github.ref, 'refs/tags/v') }}"
          
          if ($isRelease -eq "true") {
            $tag = "${{ github.ref_name }}"
            Write-Host "Building Release $tag"
            
            # Get the annotated tag message (release notes)
            $releaseNotes = git tag -l --format='%(contents)' $tag
            Write-Host "Release notes: $releaseNotes"
            
            echo "is_release=true" >> $env:GITHUB_OUTPUT
            echo "git_tag=$tag" >> $env:GITHUB_OUTPUT
            
            # Handle multiline release notes
            $delimiter = "EOF_RELEASE_NOTES_$(Get-Random)"
            echo "release_notes<<$delimiter" >> $env:GITHUB_OUTPUT
            echo "$releaseNotes" >> $env:GITHUB_OUTPUT
            echo "$delimiter" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Building regular commit (no release)"
            echo "is_release=false" >> $env:GITHUB_OUTPUT
            echo "git_tag=" >> $env:GITHUB_OUTPUT
            echo "release_notes=" >> $env:GITHUB_OUTPUT
          }
      
      - name: Setup virtual environment
        shell: pwsh
        run: |
          python --version
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          python.exe -m pip install --upgrade pip
          pip install -e .[dev,gui]
      
      - name: Linting
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          flake8 . --extend-ignore=E501 --exclude=.\venv
      
      - name: Format Check
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          black --check .
          isort --check-only .
      
      - name: Run Tests
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          python -m unittest discover -s tests -p "*_test.py" -v
      
      - name: Build Documentation
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          cd .\docs
          .\make.bat html -W
      
      - name: Build executable
        if: steps.check_release.outputs.is_release == 'true'
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          pyinstaller --onefile app\main.py --name dinau
      
      - name: Upload executable artifact
        if: steps.check_release.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dinau-executable
          path: dist/dinau.exe
          retention-days: 7

  publish-testpypi:
    needs: build-and-test
    if: needs.build-and-test.outputs.is_release == 'true'
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Setup virtual environment
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          python -m build
      
      - name: Publish to TestPyPI
        shell: pwsh
        env:
          TESTPYPI_TOKEN: ${{ secrets.TESTPYPI_TOKEN }}
        run: |
          .\venv\Scripts\Activate.ps1
          python -m twine upload --repository testpypi dist/*.whl dist/*.tar.gz --username __token__ --password $env:TESTPYPI_TOKEN --verbose

  publish-release:
    needs: build-and-test
    if: needs.build-and-test.outputs.is_release == 'true'
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: dinau-executable
          path: dist
      
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build-and-test.outputs.git_tag }}
          release_name: ${{ needs.build-and-test.outputs.git_tag }}
          body: ${{ needs.build-and-test.outputs.release_notes }}
          draft: false
          prerelease: false
      
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/dinau.exe
          asset_name: dinau-${{ needs.build-and-test.outputs.git_tag }}.exe
          asset_content_type: application/octet-stream
